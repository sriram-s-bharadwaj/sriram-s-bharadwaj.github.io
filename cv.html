<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV | Sriram Bharadwaj</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 980px;
      margin: 50px auto;
      padding: 0 24px 40px 24px;
      line-height: 1.7;
      color: #e8e8e8;
      background: #111111;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 2.5em;
      padding-bottom: 0.8em;
      border-bottom: 1px solid #333333;
    }

    .site-name {
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.2;
      text-decoration: none;
      white-space: nowrap;
    }

    .site-name:hover {
      color: #ffffff;
      text-decoration: none;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
    }

    nav a {
      color: #8ab4f8;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
    }

    nav a:hover {
      color: #a8c7fa;
      text-decoration: underline;
    }

    h1 {
      color: #ffffff;
      font-size: 2.2rem;
      margin-bottom: 0.5em;
    }

    p {
      margin-bottom: 1em;
    }

    a {
      color: #8ab4f8;
    }

    a:hover {
      color: #a8c7fa;
    }

    .cv-box {
      margin-top: 1.5em;
      overflow: hidden;
      background: #1a1a1a;
      border: 1px solid #333333;
      border-radius: 8px;
    }

    iframe {
      display: block;
      width: 100%;
      height: 900px;
      border: none;
    }

    .note {
      color: #b0b0b0;
      font-size: 0.95rem;
    }

    @media (max-width: 760px) {
      .site-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 14px;
      }

      nav {
        flex-wrap: wrap;
        justify-content: flex-start;
      }

      iframe {
        height: 700px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="site-name" href="index.html">Sriram Bharadwaj</a>

    <nav>
      <a href="index.html">Home</a>
      <a href="publications.html">Publications</a>
      <a href="cv.html">CV</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h1>CV</h1>

    <p>
      You can view my CV below or open it directly as a PDF
      <a href="CV-SriramBharadwaj.pdf" target="_blank">here</a>.
    </p>

    <p class="note">
      If the embedded viewer does not load properly, use the PDF link above.
    </p>

    <div class="cv-box">
      <iframe
        src="CV-SriramBharadwaj.pdf"
        title="Sriram Bharadwaj CV">
      </iframe>
    </div>
  </main>
</body>
</html>
